<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BTC AI Trader PRO</title>
  <script src="https://s3.tradingview.com/tv.js"></script>
</head>

<body style="background:#0b0f14;color:#e6edf3;font-family:sans-serif;margin:0;padding:0">

<h2 style="padding:10px;">BTC AI Trader PRO</h2>

<div id="info" style="padding:10px;font-size:18px;"></div>

<div id="chart" style="height:500px;"></div>

<script>
const WORKER_URL = "https://btc-ai-worker.loveradwimps-s0917s.workers.dev/api/signal";

// ===== TradingView =====
new TradingView.widget({
  container_id: "chart",
  symbol: "BINANCE:BTCUSDT",
  interval: "15",
  theme: "dark",
  style: "1",
  locale: "ja",
  toolbar_bg: "#0b0f14",
  enable_publishing: false,
  hide_top_toolbar: false,
  allow_symbol_change: false
});

// ===== データ取得 =====
async function load() {
  try {
    const res = await fetch(WORKER_URL);
    const d = await res.json();

    const color =
      d.signal === "LONG" ? "#00ff88" :
      d.signal === "SHORT" ? "#ff4d4d" : "#999";

    document.getElementById("info").innerHTML = `
      <div style="color:${color};font-size:22px;">
        SIGNAL: ${d.signal}
      </div>
      <div>Score: ${d.score}</div>
      <div>Entry: ${d.plan?.entry ?? "-"}</div>
      <div>TP: ${d.plan?.tp ?? "-"}</div>
      <div>SL: ${d.plan?.sl ?? "-"}</div>
      <div style="margin-top:10px;font-size:12px;color:#888;">
        更新: ${new Date().toLocaleTimeString()}
      </div>
    `;
  } catch (e) {
    document.getElementById("info").innerHTML =
      "<span style='color:red'>API接続エラー</span>";
  }
}

// ===== 5秒更新 =====
setInterval(load, 5000);
load();
</script>

</body>
</html>
