<!DOCTYPE html>
<html>
<head>
  <title>BTC AI Trader FINAL</title>
  <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body style="background:#0b0f14;color:#e6edf3;font-family:sans-serif">

<h2>BTC AI Trader FINAL</h2>
<div id="info"></div>
<div id="chart" style="height:500px;"></div>

<script>
new TradingView.widget({
  container_id: "chart",
  symbol: "BINANCE:BTCUSDT",
  interval: "15",
  theme: "dark"
});

async function load() {
  const res = await fetch("/api/signal");
  const d = await res.json();
  document.getElementById("info").innerHTML =
    `Signal:${d.signal} Score:${d.score}<br>
     Entry:${d.plan?.entry||"-"} TP:${d.plan?.tp||"-"} SL:${d.plan?.sl||"-"}`;
}
setInterval(load,3000); load();
</script>
</body>
</html>
